default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch('DB_USERNAME') { 'postgres' } %>
  password: <%= ENV.fetch('DB_PASSWORD') { 'postgres' } %>
  host: <%= ENV['DB_HOST'] %>
  pool: 200
  timeout: 100000

development:
  <<: *default
  database: deskbolic_development

test:
  <<: *default
  database: deskbolic_test

production:
  <<: *default
  database: deskbolic_production
  username: <%= Rails.application.credentials.db_username %>
  password: <%= Rails.application.credentials.db_password %>

staging:
  <<: *default
  database: deskbolic_staging
  username: <%= Rails.application.credentials.db_username %>
  password: <%= Rails.application.credentials.db_password %>
